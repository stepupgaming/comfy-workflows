name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:packed-consumer
      # Generated wrappers must be up to date with the committed defs snapshot.
      - run: pnpm codegen:core && git diff --exit-code src/nodes/gen
      # Workflow package artifacts (IR + manifest) must be up to date.
      - run: pnpm build:packages && git diff --exit-code packages/*/workflow.ir.json packages/*/comfy.workflow.json
      # Core tarball must contain exactly the publishable set.
      - run: pnpm pack --dry-run
      - run: pnpm docs:check
